# Runs on every push: checks the code for syntax errors and basic issues
name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linter
        run: pip install ruff
      - name: Lint
        run: ruff check src
      - name: Compile check
        run: python -m py_compile src/judge_pipeline.py src/analyze_results.py
